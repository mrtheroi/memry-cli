name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# One release per tag at a time. v1.1.1 started two runs in the same
# second that uploaded the same assets in parallel; a second run now waits
# and then stops at the upload, without racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # go vet, go test -race and golangci-lint, as on every push.
  test:
    uses: ./.github/workflows/go.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # keyless cosign signing with the workflow's OIDC identity
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.2 # no floating v4 tag exists
      - uses: anchore/sbom-action/download-syft@v0
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        # A release candidate (v1.1.0-rc.1) uses the notes of its version.
        run: |
          VERSION="${VERSION#v}"
          VERSION="${VERSION%%-*}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
      - name: Warn when the winget token is missing
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          if [ -z "$WINGET_GITHUB_TOKEN" ]; then
            echo "::warning::WINGET_GITHUB_TOKEN is not set; skipping the winget manifest."
            echo "WINGET_GITHUB_TOKEN is not set; the winget manifest was skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
