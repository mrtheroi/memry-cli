name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # go vet, go test -race and golangci-lint, as on every push.
  test:
    uses: ./.github/workflows/go.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # keyless cosign signing with the workflow's OIDC identity
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v4.1.2 # no floating v4 tag exists
      - uses: anchore/sbom-action/download-syft@v0
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v heading="## [${VERSION#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}"
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
