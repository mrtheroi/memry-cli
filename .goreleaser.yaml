# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: memry

builds:
  - id: memry
    main: ./cmd/memry
    binary: memry
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: memry
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, written by syft.
sboms:
  - artifacts: archive

# Keyless signing of checksums.txt with the workflow's GitHub OIDC identity.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/mrtheroi/memry-cli/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release workflow passes the version's CHANGELOG.md section with
# --release-notes, which replaces this git log changelog.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: mrtheroi
    name: memry-cli
