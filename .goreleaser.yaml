# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: memry

builds:
  - id: memry
    main: ./cmd/memry
    binary: memry
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: memry
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, written by syft.
sboms:
  - artifacts: archive

# Keyless signing of checksums.txt with the workflow's GitHub OIDC identity.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/mrtheroi/memry-cli/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# Portable winget manifest (zip archive with a nested memry.exe, exposed as the
# `memry` command). It opens a PR from the mrtheroi/winget-pkgs fork against
# microsoft/winget-pkgs. Without WINGET_GITHUB_TOKEN, or for a release
# candidate, the upload is skipped so the rest of the release is never
# affected (release.yml warns about a missing token).
winget:
  - name: memry
    publisher: Memry
    package_identifier: Memry.Memry
    short_description: Persistent memory for your AI coding agents
    description: Persistent memory for your AI coding agents that carries over between sessions and projects.
    license: MIT
    homepage: https://github.com/mrtheroi/memry-cli
    publisher_url: https://github.com/mrtheroi
    publisher_support_url: https://github.com/mrtheroi/memry-cli/issues
    license_url: https://github.com/mrtheroi/memry-cli/blob/main/LICENSE
    release_notes_url: https://github.com/mrtheroi/memry-cli/releases/tag/{{ .Tag }}
    release_notes: "{{ .Changelog }}"
    # Release candidates (v1.1.0-rc.1) never reach winget.
    skip_upload: '{{ if or .Prerelease (eq (envOrDefault "WINGET_GITHUB_TOKEN" "") "") }}true{{ else }}false{{ end }}'
    commit_author:
      name: mrtheroi
      email: mrtheroi@users.noreply.github.com
    repository:
      owner: mrtheroi
      name: winget-pkgs
      branch: "memry-{{ .Version }}"
      # The token template has no envOrDefault; skip_upload keeps it from being
      # rendered when the variable is missing.
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release workflow passes the version's CHANGELOG.md section with
# --release-notes, which replaces this git log changelog.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: mrtheroi
    name: memry-cli
  # A tag like v1.1.0-rc.1 is published as a pre-release, so it never becomes
  # the latest release.
  prerelease: auto
